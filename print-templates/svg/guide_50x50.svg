<g id="face-edge"><rect x="6" y="6" width="50" height="50" rx="1" fill="none" stroke="#1e6edc" stroke-width="0.2" stroke-dasharray="1.2 0.8"/></g>
<g id="keep-text-inside"><rect x="9" y="9" width="44" height="44" rx="0" fill="none" stroke="#c0306f" stroke-width="0.2" stroke-dasharray="0.4 0.6"/></g>
</svg>
